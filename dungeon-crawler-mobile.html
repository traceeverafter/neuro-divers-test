    function cognitiveProfileFor(stats) {
      const entries = [
        {
          key: "code",
          title: "SEQUENCE OPERATOR",
          color: colors.blue,
          success: stats.codeTraceSuccesses,
          attempts: stats.codeTraceAttempts,
          detail: "順序記憶と入力精度が高い。コード列の処理に強い。"
        },
        {
          key: "phase",
          title: "PHASE READER",
          color: colors.gold,
          success: stats.phaseLockSuccesses,
          attempts: stats.phaseLockAttempts,
          detail: "同期タイミングを読む力が高い。待って押す判断に強い。"
        },
        {
          key: "anomaly",
          title: "ANOMALY HUNTER",
          color: colors.green,
          success: stats.anomalyScanSuccesses,
          attempts: stats.anomalyScanAttempts,
          detail: "視覚探索と違和感検出が高い。群れの中の異物を見抜く。"
        }
      ].map(entry => ({
        ...entry,
        rate: entry.attempts ? entry.success / entry.attempts : -1
      }));
      const totalAttempts = entries.reduce((sum, entry) => sum + entry.attempts, 0);
      if (totalAttempts < 3) {
        return {
          title: "INSUFFICIENT DATA",
          color: colors.muted,
          detail: "ジャミング試行数が少ない。さらなる接続ログが必要。"
        };
      }
      const attempted = entries.filter(entry => entry.attempts > 0).sort((a, b) => b.rate - a.rate);
      if (attempted.length >= 3 && attempted.every(entry => entry.rate >= 0.75)) {
        return {
          title: "BALANCED NEURODIVER",
          color: colors.line,
          detail: "記憶、同期、探索が高水準で安定している。"
        };
      }
      const best = attempted[0];
      if (!best || best.rate < 0.34) {
        return {
          title: "UNSTABLE SIGNAL",
          color: colors.red,
          detail: "ジャミング精度が不安定。装備か戦術の見直しが必要。"
        };
      }
      return best;
    }

    function marker(ox, oy, cell, pos, color) {
      fillRect({ x: ox + pos.x * cell + 1, y: oy + pos.y * cell + 1, w: cell - 2, h: cell - 2 }, color);
    }

    function roundRect(r, fill, stroke = null, width = 1, radius = 8) {
      const rr = Math.min(radius, r.w / 2, r.h / 2);
      ctx.beginPath();
      ctx.moveTo(r.x + rr, r.y);
      ctx.lineTo(r.x + r.w - rr, r.y);
      ctx.quadraticCurveTo(r.x + r.w, r.y, r.x + r.w, r.y + rr);
      ctx.lineTo(r.x + r.w, r.y + r.h - rr);
      ctx.quadraticCurveTo(r.x + r.w, r.y + r.h, r.x + r.w - rr, r.y + r.h);
      ctx.lineTo(r.x + rr, r.y + r.h);
      ctx.quadraticCurveTo(r.x, r.y + r.h, r.x, r.y + r.h - rr);
      ctx.lineTo(r.x, r.y + rr);
      ctx.quadraticCurveTo(r.x, r.y, r.x + rr, r.y);
      ctx.closePath();
      ctx.fillStyle = fill;
      ctx.fill();
      if (stroke) {
        ctx.strokeStyle = stroke;
        ctx.lineWidth = width;
        ctx.stroke();
      }
    }

    function roundedClip(r, radius = 8) {
      const rr = Math.min(radius, r.w / 2, r.h / 2);
      ctx.beginPath();
      ctx.moveTo(r.x + rr, r.y);
      ctx.lineTo(r.x + r.w - rr, r.y);
      ctx.quadraticCurveTo(r.x + r.w, r.y, r.x + r.w, r.y + rr);
      ctx.lineTo(r.x + r.w, r.y + r.h - rr);
      ctx.quadraticCurveTo(r.x + r.w, r.y + r.h, r.x + r.w - rr, r.y + r.h);
      ctx.lineTo(r.x + rr, r.y + r.h);
      ctx.quadraticCurveTo(r.x, r.y + r.h, r.x, r.y + r.h - rr);
      ctx.lineTo(r.x, r.y + rr);
      ctx.quadraticCurveTo(r.x, r.y, r.x + rr, r.y);
      ctx.closePath();
      ctx.clip();
    }

    function drawBar(x, y, w, h, rate, fill) {
      roundRect({ x, y, w, h }, "#283449", null, 1, h / 2);
      roundRect({ x, y, w: Math.max(h, w * rate), h }, fill, null, 1, h / 2);
    }

    function fillRect(r, color) {
      ctx.fillStyle = color;
      ctx.fillRect(r.x, r.y, r.w, r.h);
    }

    function strokeRect(r, color = colors.line, width = 2) {
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.strokeRect(r.x, r.y, r.w, r.h);
    }

    function wallRect(r, fill, stroke, depth) {
      const points = [
        [r.x, r.y],
        [r.x + r.w, r.y],
        [r.x + r.w, r.y + r.h],
        [r.x, r.y + r.h]
      ];
      wallPanel(points, fill, stroke, depth);
    }

    function wallPanel(points, fill, stroke, depth) {
      polygon(points, fill);
      fillPanelTint(points, stroke, depth);
      drawWallScanlines(points, stroke, depth);
      drawFloorReflection(points, stroke, depth);
      const glow = Math.max(2, 5 - depth * 0.45);
      const coreWidth = Math.max(0.72, 1.15 - depth * 0.05);
      ctx.save();
      ctx.lineJoin = "round";
      ctx.lineCap = "round";
      ctx.globalCompositeOperation = "lighter";

      ctx.strokeStyle = stroke;
      ctx.shadowColor = stroke;
      ctx.shadowBlur = glow;
      ctx.globalAlpha = 0.32;
      ctx.lineWidth = coreWidth + 0.75;
      strokePanelPath(points);

      ctx.globalAlpha = 0.72;
      ctx.shadowBlur = 0;
      ctx.lineWidth = coreWidth;
      strokePanelPath(points);
      ctx.restore();
    }

    function drawWallScanlines(points, color, depth) {
      const bounds = panelBounds(points);
      if (bounds.w <= 4 || bounds.h <= 4) return;

      const alpha = Math.max(0.012, 0.04 - depth * 0.005);
      const pattern = scanlinePattern(color, alpha);
      if (!pattern) return;

      ctx.save();
      ctx.beginPath();
      ctx.moveTo(points[0][0], points[0][1]);
      for (const point of points.slice(1)) ctx.lineTo(point[0], point[1]);
      ctx.closePath();
      ctx.clip();

      ctx.globalCompositeOperation = "lighter";
      ctx.fillStyle = pattern;
      ctx.fillRect(bounds.x, bounds.y, bounds.w, bounds.h);

      ctx.restore();
    }

    function scanlinePattern(color, alpha) {
      const key = `${color}:${alpha.toFixed(3)}`;
      if (scanlinePatternCache.has(key)) return scanlinePatternCache.get(key);

      const patternCanvas = document.createElement("canvas");
      patternCanvas.width = 4;
      patternCanvas.height = 4;
      const patternContext = patternCanvas.getContext("2d");
      patternContext.clearRect(0, 0, patternCanvas.width, patternCanvas.height);
      patternContext.fillStyle = neonRgba(color, alpha);
      patternContext.fillRect(0, 0, patternCanvas.width, 1);

      const pattern = ctx.createPattern(patternCanvas, "repeat");
      scanlinePatternCache.set(key, pattern);
      return pattern;
    }

    function lerpPoint(a, b, t) {
      return [
        a[0] + (b[0] - a[0]) * t,
        a[1] + (b[1] - a[1]) * t
      ];
    }

    function strokePanelPath(points) {
      ctx.beginPath();
      ctx.moveTo(points[0][0], points[0][1]);
      for (const point of points.slice(1)) ctx.lineTo(point[0], point[1]);
      ctx.closePath();
      ctx.stroke();
    }

    function fillPanelTint(points, color, depth) {
      const alpha = Math.max(0.025, 0.12 - depth * 0.018);
      const bounds = panelBounds(points);
      const gradient = ctx.createLinearGradient(bounds.x, bounds.y, bounds.x, bounds.y + bounds.h);
      gradient.addColorStop(0, neonRgba(color, alpha));
      gradient.addColorStop(0.48, neonRgba(color, alpha * 0.42));
      gradient.addColorStop(1, "rgba(0, 0, 0, 0)");
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(points[0][0], points[0][1]);
      for (const point of points.slice(1)) ctx.lineTo(point[0], point[1]);
      ctx.closePath();
      ctx.clip();
      ctx.fillStyle = gradient;
      ctx.fillRect(bounds.x, bounds.y, bounds.w, bounds.h);
      ctx.restore();
    }

    function drawFloorReflection(points, color, depth) {
      const bounds = panelBounds(points);
      const bottomEdges = [];
      for (let i = 0; i < points.length; i += 1) {
        const a = points[i];
        const b = points[(i + 1) % points.length];
        const edgeY = (a[1] + b[1]) / 2;
        const edgeIsLow = edgeY > bounds.y + bounds.h * 0.55;
        if (edgeIsLow) bottomEdges.push([a, b]);
      }

      if (bottomEdges.length === 0) return;

      const alpha = Math.max(0.018, 0.08 - depth * 0.012);
      const offsets = [5, 10, 16, 23];
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      for (const [a, b] of bottomEdges) {
        offsets.forEach((offset, index) => {
          const fade = alpha * (1 - index / offsets.length);
          ctx.strokeStyle = neonRgba(color, fade);
          ctx.lineWidth = Math.max(0.55, 1.3 - depth * 0.12 - index * 0.16);
          ctx.beginPath();
          ctx.moveTo(a[0], a[1] + offset);
          ctx.lineTo(b[0], b[1] + offset);
          ctx.stroke();
        });
      }
      ctx.restore();
    }

    function panelBounds(points) {
      const xs = points.map(point => point[0]);
      const ys = points.map(point => point[1]);
      const x = Math.min(...xs);
      const y = Math.min(...ys);
      return {
        x,
        y,
        w: Math.max(...xs) - x,
        h: Math.max(...ys) - y
      };
    }

    function neonRgba(hex, alpha) {
      const value = hex.replace("#", "");
      const r = Number.parseInt(value.slice(0, 2), 16);
      const g = Number.parseInt(value.slice(2, 4), 16);
      const b = Number.parseInt(value.slice(4, 6), 16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function line(x1, y1, x2, y2, color = colors.line, width = 2) {
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }

    function polygon(points, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(points[0][0], points[0][1]);
      for (const point of points.slice(1)) ctx.lineTo(point[0], point[1]);
      ctx.closePath();
      ctx.fill();
    }

    function circle(x, y, radius, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fill();
    }

    function text(value, x, y, size = 16, color = colors.line, weight = "normal") {
      ctx.fillStyle = color;
      ctx.font = `${weight} ${size}px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace`;
      ctx.fillText(value, x, y);
    }

    window.addEventListener("resize", resize);
    window.addEventListener("message", event => {
      if (!event.data || !state.combatOpen) return;
      if (event.data.type === "combat-finished") {
        showCombatResult(event.data);
      }
      if (event.data.type === "combat-return-request") {
        requestCombatReturn();
      }
    });

    function requestCombatReturn() {
      if (!state.combatOpen) return;
      if (state.pendingCombatResult) {
        finishCombatPopup();
        return;
      }
      state.combatReturnRequested = true;
    }

    window.addEventListener("keydown", event => {
      if (event.target === runnerNameInput) {
        if (event.code === "Enter") {
          event.preventDefault();
          restart();
        }
        return;
      }
      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space", "KeyB", "KeyP", "Escape", "Digit0", "Digit1", "Digit2", "Digit3", "Digit4", "Digit5", "Digit6", "Digit7", "Digit8", "Digit9", "Enter"].includes(event.code)) {
        event.preventDefault();
      }
      if (state.combatOpen && state.pendingCombatResult && ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(event.code)) {
        finishCombatPopup();
        return;
      }
      if (state.mode === "title") {
        if (event.code === "Enter") restart();
        return;
      }
      if (state.combatOpen) {
        return;
      }
      if (state.encounterPending) {
        return;
      }
      if (state.showMap) {
        if (event.code === "Space" || event.code === "Escape") {
          toggleMap();
        }
        return;
      }
      if (event.code === "KeyP" || event.code === "Escape") {
        togglePause();
        return;
      }
      if (state.mode === "paused") {
        return;
      }
      if (state.gameOver) {
        if (event.code === "Enter") reborn();
        return;
      }
      if (event.code === "ArrowUp") tryMove(relativePos(0, 1));
      if (event.code === "ArrowDown") tryMove(relativePos(0, -1));
      if (event.code === "ArrowLeft") {
        state.dir = (state.dir + 3) % 4;
        draw();
      }
      if (event.code === "ArrowRight") {
        state.dir = (state.dir + 1) % 4;
        draw();
      }
      if (event.code === "KeyB") buyPotion();
      if (event.code === "Digit1") trainStat("meleeSkill");
      if (event.code === "Digit2") trainStat("shootingSkill");
      if (event.code === "Digit3") trainStat("agility");
      if (event.code === "Digit4") trainStat("toughness");
      if (event.code === "Digit5") upgradeWeapon("melee");
      if (event.code === "Digit6") upgradeWeapon("shoot");
      if (event.code === "Digit7") learnSkill("iaido");
      if (event.code === "Digit8") learnSkill("mindEye");
      if (event.code === "Digit9") learnSkill("dash");
      if (event.code === "Digit0") learnSkill("immovable");
      if (event.code === "Space") {
        toggleMap();
      }
    });
    combatContinueButton.addEventListener("click", finishCombatPopup);
    combatFrame.addEventListener("load", focusCombatFrame);
    startGameButton.addEventListener("click", restart);
    continueGameButton.addEventListener("click", () => continueSavedGame());
    resumeButton.addEventListener("click", resumeGame);
    pauseRestartButton.addEventListener("click", showTitleConfirm);
    titleConfirmButton.addEventListener("click", reborn);
    titleCancelButton.addEventListener("click", hideTitleConfirm);
    runnerNameInput.addEventListener("input", renderTitleMenu);
    portraitSelect.addEventListener("click", event => {
      const button = event.target.closest("button[data-archetype]");
      if (!button) return;
      state.archetypeKey = button.dataset.archetype;
      state.playerName = currentArchetypeDefaultName();
      runnerNameInput.value = state.playerName;
      resetCustomStats();
    });
    saveSlotList.addEventListener("click", event => {
      const loadButton = event.target.closest("button[data-save-load]");
      if (loadButton && !loadButton.disabled) {
        continueSavedGame(Number(loadButton.dataset.saveLoad));
        return;
      }
      const deleteButton = event.target.closest("button[data-save-delete]");
      if (deleteButton && !deleteButton.disabled) {
        deleteSaveSlot(Number(deleteButton.dataset.saveDelete));
      }
    });
    pauseStatList.addEventListener("click", event => {
      const button = event.target.closest("button[data-dojo-kind]");
      if (!button || button.disabled) return;
      const kind = button.dataset.dojoKind;
      const target = button.dataset.dojoTarget;
      if (kind === "stat") trainStat(target);
      if (kind === "weapon") upgradeWeapon(target);
      if (kind === "skill") learnSkill(target);
      renderPauseMenu();
    });
    pauseResourceList.addEventListener("click", event => {
      const button = event.target.closest("button[data-dojo-service]");
      if (!button || button.disabled) return;
      if (button.dataset.dojoService === "potion") buyPotion();
      if (button.dataset.dojoService === "radar") toggleMap();
      renderPauseMenu();
    });
    document.querySelectorAll("[data-mobile-key]").forEach(button => {
      button.addEventListener("pointerdown", event => {
        event.preventDefault();
        getAudioContext();
        window.dispatchEvent(new KeyboardEvent("keydown", {
          code: button.dataset.mobileKey,
          bubbles: true,
          cancelable: true
        }));
      });
    });
    renderTitleMenu();
    resize();
  </script>
</body>
</html>
