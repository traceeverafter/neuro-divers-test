<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NEURO DIVERS Mobile</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050505;
      --line: #f2f2f2;
      --wall: #565656;
      --muted: #a7a7a7;
      --red: #e33535;
      --green: #38d26e;
      --blue: #4c8cff;
      --gold: #f0c441;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--line);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    body {
      display: grid;
      place-items: center;
    }

    canvas {
      display: block;
      background: var(--bg);
    }

    .mobile-controls {
      position: fixed;
      right: calc(18px + env(safe-area-inset-right, 0px));
      bottom: calc(18px + env(safe-area-inset-bottom, 0px));
      z-index: 20;
      display: grid;
      grid-template-columns: repeat(3, 64px);
      grid-template-rows: repeat(4, 50px);
      gap: 8px;
      pointer-events: auto;
    }

    .mobile-controls button {
      border: 1px solid rgba(0, 229, 255, .58);
      border-radius: 10px;
      background: rgba(5, 11, 18, .78);
      color: #edf8ff;
      font: 900 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      box-shadow:
        0 0 14px rgba(0, 229, 255, .16),
        inset 0 0 10px rgba(0, 229, 255, .08);
      touch-action: manipulation;
    }

    .mobile-controls .up { grid-column: 2; grid-row: 1; }
    .mobile-controls .left { grid-column: 1; grid-row: 2; }
    .mobile-controls .down { grid-column: 2; grid-row: 2; }
    .mobile-controls .right { grid-column: 3; grid-row: 2; }
    .mobile-controls .map { grid-column: 1; grid-row: 3; }
    .mobile-controls .menu { grid-column: 2; grid-row: 3; }
    .mobile-controls .buy { grid-column: 1 / span 3; grid-row: 4; }

    .combat-overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(0, 0, 0, .78);
      z-index: 10;
    }

    .combat-overlay.active {
      display: flex;
    }

    .combat-popup {
      position: relative;
      width: min(1080px, calc(100vw - 18px));
      height: min(720px, calc(100vh - 18px));
      border: 0;
      border-radius: 8px;
      overflow: hidden;
      background: #05070b;
      box-shadow: 0 24px 80px rgba(0, 0, 0, .62);
    }

    .combat-frame {
      width: 100%;
      height: 100%;
      border: 0;
      background: #05070b;
    }

    .combat-result {
      position: absolute;
      left: 50%;
      top: 28px;
      display: none;
      align-items: center;
      transform: translateX(-50%);
      padding: 0;
      border: 1px solid rgba(0, 229, 255, .76);
      border-radius: 8px;
      background: rgba(5, 11, 18, .9);
      color: #f4f7fb;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      font-weight: 800;
      box-shadow:
        0 0 24px rgba(0, 229, 255, .24),
        inset 0 0 18px rgba(0, 229, 255, .08);
      white-space: nowrap;
    }

    .combat-result.active {
      display: flex;
    }

    .combat-result button {
      min-height: 34px;
      padding: 0 22px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #f4f7fb;
      font: inherit;
      font-weight: 850;
      cursor: pointer;
      letter-spacing: 0;
      text-shadow: 0 0 10px rgba(0, 229, 255, .6);
    }

    .combat-result span {
      display: none;
    }

    .encounter-flash {
      position: fixed;
      left: 50vw;
      top: 12vh;
      z-index: 9;
      display: none;
      min-width: 260px;
      transform: translateX(-50%);
      padding: 12px 28px;
      border: 1px solid rgba(210, 216, 224, .72);
      border-radius: 8px;
      background: rgba(3, 5, 10, .78);
      color: #d8dde6;
      font-size: clamp(18px, 2vw, 30px);
      font-weight: 950;
      letter-spacing: 0;
      text-align: center;
      text-shadow:
        0 0 8px rgba(220, 226, 236, .72),
        0 0 18px rgba(120, 132, 148, .58);
      box-shadow:
        0 0 24px rgba(180, 190, 204, .24),
        inset 0 0 18px rgba(220, 226, 236, .08);
      pointer-events: none;
    }

    .encounter-flash.active {
      display: block;
      animation: encounterPulse 1s ease-out both;
    }

    @keyframes encounterPulse {
      0% { opacity: 0; transform: translateX(-50%) scale(.94); filter: blur(3px); }
      20% { opacity: 1; transform: translateX(-50%) scale(1.02); filter: blur(0); }
      100% { opacity: 0; transform: translateX(-50%) scale(1); filter: blur(1px); }
    }

    .trap-flash {
      position: fixed;
      inset: 0;
      z-index: 9;
      display: none;
      pointer-events: none;
      background:
        radial-gradient(circle at 42.5% 31%, rgba(255, 255, 255, .82), transparent 12%),
        radial-gradient(circle at 42.5% 31%, rgba(255, 77, 109, .42), transparent 34%),
        rgba(255, 255, 255, .12);
      mix-blend-mode: screen;
    }

    .trap-flash.active {
      display: block;
      animation: trapPulse .72s ease-out both;
    }

    @keyframes trapPulse {
      0% { opacity: 0; }
      12% { opacity: 1; }
      38% { opacity: .45; }
      100% { opacity: 0; }
    }

    .screen-overlay {
      position: fixed;
      inset: 0;
      z-index: 8;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 18%, rgba(0, 229, 255, .14), transparent 32%),
        linear-gradient(180deg, rgba(0, 0, 0, .82), rgba(0, 0, 0, .94));
      color: var(--line);
    }

    .screen-overlay.active {
      display: flex;
    }

    .menu-panel {
      display: grid;
      grid-template-columns: minmax(280px, 420px) minmax(280px, 420px);
      gap: 18px;
      width: min(900px, 94vw);
      padding: 18px;
      border: 1px solid rgba(0, 229, 255, .45);
      border-radius: 8px;
      background:
        linear-gradient(180deg, rgba(21, 29, 43, .92), rgba(5, 8, 12, .96));
      box-shadow:
        0 0 28px rgba(0, 229, 255, .12),
        inset 0 0 22px rgba(0, 229, 255, .05);
    }

    #titleOverlay .menu-panel {
      grid-template-columns: minmax(310px, 1fr) minmax(310px, 390px);
      align-items: stretch;
      width: min(960px, 94vw);
    }

    .menu-title {
      margin: 0 0 10px;
      color: #f0c441;
      font-size: clamp(26px, 4vw, 42px);
      line-height: 1;
      letter-spacing: 0;
    }

    .menu-copy {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .title-logo {
      display: block;
      grid-column: 1 / -1;
      width: min(760px, 100%);
      margin: -10px auto -2px;
      line-height: 0;
    }

    .title-logo::before,
    .title-logo::after {
      display: none;
    }

    .title-logo img {
      display: block;
      width: 100%;
      height: auto;
      filter: drop-shadow(0 0 16px rgba(0, 229, 255, .18));
    }

    #titleOverlay .character-card {
      align-self: stretch;
      display: grid;
      grid-template-rows: minmax(270px, 1fr) auto auto;
    }

    #titleOverlay .title-controls {
      align-self: stretch;
      display: grid;
      grid-template-rows: auto auto 1fr;
    }

    #titleOverlay .character-art {
      height: 100%;
      min-height: 292px;
      margin-bottom: 12px;
    }

    .character-card {
      min-height: 360px;
      padding: 16px;
      border: 1px solid rgba(240, 196, 65, .28);
      border-radius: 8px;
      background:
        radial-gradient(circle at 50% 24%, rgba(76, 140, 255, .18), transparent 28%),
        linear-gradient(180deg, rgba(10, 16, 24, .76), rgba(2, 2, 2, .84));
    }

    .character-art {
      position: relative;
      height: 230px;
      margin-bottom: 14px;
      overflow: hidden;
      border: 1px solid rgba(0, 229, 255, .22);
      border-radius: 8px;
      background:
        linear-gradient(90deg, rgba(255, 255, 255, .035) 1px, transparent 1px),
        linear-gradient(0deg, rgba(255, 255, 255, .025) 1px, transparent 1px),
        radial-gradient(circle at 50% 30%, rgba(0, 229, 255, .16), transparent 34%),
        #020406;
      background-size: 28px 28px, 28px 28px, auto, auto;
    }

    .character-art::before {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 18px;
      width: 116px;
      height: 172px;
      transform: translateX(-50%);
      clip-path: polygon(42% 0, 58% 0, 68% 14%, 74% 44%, 92% 100%, 8% 100%, 26% 44%, 32% 14%);
      background:
        linear-gradient(135deg, rgba(255, 255, 255, .16), transparent 28%),
        linear-gradient(180deg, #1d2637, #06080d 72%);
      box-shadow: 0 0 28px rgba(0, 229, 255, .22);
    }

    .character-art::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 28px;
      width: 58px;
      height: 58px;
      transform: translateX(-50%);
      border: 1px solid rgba(191, 231, 255, .52);
      border-radius: 50%;
      background: linear-gradient(180deg, #25324a, #080b12);
      box-shadow: 0 0 18px rgba(0, 229, 255, .32);
    }

    #titleOverlay .character-art,
    #pauseOverlay .character-art {
      height: 260px;
      border-color: rgba(240, 196, 65, .32);
      background:
        linear-gradient(180deg, rgba(0, 0, 0, .02), rgba(0, 0, 0, .28)),
        var(--character-art-image, url("character-blade.png")) center 24% / cover no-repeat,
        #020406;
      box-shadow:
        0 0 28px rgba(0, 229, 255, .12),
        inset 0 0 28px rgba(0, 0, 0, .22);
    }

    #titleOverlay .character-art {
      height: 100%;
      min-height: 292px;
      margin-bottom: 12px;
    }

    #titleOverlay .character-art::before,
    #titleOverlay .character-art::after,
    #pauseOverlay .character-art::before,
    #pauseOverlay .character-art::after {
      display: none;
    }

    .dojo-profile {
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: 10px;
      display: grid;
      gap: 6px;
      padding: 10px;
      border: 1px solid rgba(240, 196, 65, .34);
      border-radius: 8px;
      background: linear-gradient(180deg, rgba(2, 4, 8, .28), rgba(2, 4, 8, .82));
      backdrop-filter: blur(2px);
    }

    .dojo-profile-name {
      color: #f4f7fb;
      font-size: 18px;
      font-weight: 950;
      line-height: 1;
      text-shadow: 0 0 10px rgba(0, 0, 0, .82);
    }

    .dojo-profile-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      color: #ffdc8a;
      font-size: 11px;
      font-weight: 850;
    }

    .dojo-profile-meta span {
      padding: 3px 6px;
      border: 1px solid rgba(240, 196, 65, .34);
      border-radius: 999px;
      background: rgba(0, 0, 0, .34);
    }

    .menu-stat-list {
      display: grid;
      gap: 7px;
    }

    .menu-stat {
      display: grid;
      grid-template-columns: 72px 1fr auto;
      gap: 10px;
      align-items: center;
      min-height: 34px;
      padding: 6px 8px;
      border: 1px solid rgba(45, 58, 80, .9);
      border-radius: 8px;
      background: rgba(21, 29, 43, .7);
    }

    .menu-stat strong {
      color: var(--line);
      font-size: 13px;
    }

    .menu-stat span {
      color: var(--muted);
      font-size: 12px;
    }

    .menu-stat .value {
      color: #43c383;
      font-size: 18px;
      font-weight: 900;
    }

    .portrait-select {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 0 0 10px;
    }

    .portrait-button {
      display: grid;
      grid-template-columns: 64px 1fr;
      gap: 10px;
      align-items: center;
      min-height: 104px;
      padding: 8px;
      border: 1px solid rgba(45, 58, 80, .9);
      border-radius: 8px;
      background: rgba(21, 29, 43, .72);
      color: var(--line);
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    .portrait-button.selected {
      border-color: rgba(240, 196, 65, .72);
      background: rgba(92, 62, 14, .35);
      box-shadow: 0 0 18px rgba(240, 196, 65, .16);
    }

    .portrait-thumb {
      width: 64px;
      height: 82px;
      border: 1px solid rgba(240, 196, 65, .34);
      border-radius: 7px;
      background: var(--portrait-thumb) center 24% / cover no-repeat;
    }

    .portrait-label {
      display: block;
      color: #f4f7fb;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .08em;
    }

    .portrait-stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 4px;
      margin-top: 8px;
    }

    .portrait-stat {
      min-width: 0;
      padding: 4px 3px;
      border: 1px solid rgba(0, 229, 255, .18);
      border-radius: 6px;
      background: rgba(1, 6, 10, .54);
      text-align: center;
    }

    .portrait-stat strong,
    .portrait-stat span {
      display: block;
      line-height: 1;
    }

    .portrait-stat strong {
      color: var(--muted);
      font-size: 9px;
      font-weight: 850;
    }

    .portrait-stat span {
      margin-top: 3px;
      color: #43c383;
      font-size: 13px;
      font-weight: 950;
    }

    .dojo-list {
      display: grid;
      gap: 12px;
    }

    .dojo-section {
      display: grid;
      gap: 6px;
      padding: 8px;
      border: 1px solid rgba(45, 58, 80, .9);
      border-radius: 8px;
      background: rgba(5, 8, 12, .58);
    }

    .dojo-section h2 {
      margin: 0 0 2px;
      color: #ffdc8a;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0;
    }

    .dojo-button {
      display: grid;
      grid-template-columns: 64px 1fr auto;
      gap: 8px;
      align-items: center;
      min-height: 34px;
      padding: 6px 8px;
      border: 1px solid rgba(0, 229, 255, .34);
      border-radius: 8px;
      background: rgba(0, 229, 255, .09);
      color: var(--line);
      font: inherit;
      text-align: left;
      cursor: pointer;
      box-shadow:
        0 0 14px rgba(0, 229, 255, .12),
        inset 0 0 14px rgba(0, 229, 255, .04);
    }

    .dojo-button strong {
      color: #f4f7fb;
      font-size: 13px;
      font-weight: 900;
    }

    .dojo-button span {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.25;
    }

    .dojo-button .dojo-cost {
      color: #ffdc8a;
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
    }

    .dojo-complete {
      grid-column: 2 / -1;
      justify-self: start;
      margin-top: -3px;
      padding: 2px 7px;
      border: 1px solid rgba(67, 195, 131, .52);
      border-radius: 999px;
      background: rgba(67, 195, 131, .14);
      color: #8ce0b4;
      font-size: 11px;
      font-weight: 900;
      line-height: 1.2;
    }

    .dojo-button:disabled {
      border-color: rgba(75, 88, 108, .38);
      background: rgba(18, 23, 32, .54);
      color: rgba(232, 237, 247, .42);
      cursor: default;
      box-shadow: none;
      opacity: .55;
    }

    .dojo-button:disabled strong,
    .dojo-button:disabled span,
    .dojo-button:disabled .dojo-cost,
    .dojo-button:disabled .dojo-complete {
      color: rgba(154, 168, 189, .62);
    }

    .dojo-status {
      display: grid;
      gap: 10px;
    }

    .dojo-status-strip {
      display: grid;
      grid-template-columns: 1.35fr 1fr;
      gap: 6px;
      padding: 8px;
      border: 1px solid rgba(45, 58, 80, .9);
      border-radius: 8px;
      background: rgba(28, 39, 56, .86);
    }

    .dojo-status-group {
      min-width: 0;
      display: grid;
      gap: 6px;
      padding: 7px;
      border: 1px solid rgba(45, 58, 80, .78);
      border-radius: 8px;
      background: rgba(8, 12, 18, .54);
    }

    .dojo-status-group-title {
      color: var(--muted);
      font-size: 10px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: .04em;
    }

    .dojo-status-group-grid {
      display: grid;
      grid-template-columns: repeat(var(--dojo-status-columns, 4), minmax(0, 1fr));
      gap: 5px;
    }

    .dojo-status-cell {
      min-width: 0;
      padding: 6px 5px;
      border: 1px solid rgba(45, 58, 80, .85);
      border-radius: 8px;
      background: rgba(8, 12, 18, .72);
    }

    .dojo-status-cell strong {
      display: block;
      margin-bottom: 5px;
      color: #43c383;
      font-size: 10px;
      font-weight: 900;
      line-height: 1;
    }

    .dojo-status-cell .value {
      color: #43c383;
      font-size: 20px;
      font-weight: 950;
      line-height: 1;
    }

    .dojo-status-cell.weapon strong,
    .dojo-status-cell.weapon .value {
      color: #f0c441;
    }

    .dojo-status-cell.hp strong,
    .dojo-status-cell.hp .value {
      color: #8ce0b4;
    }

    .dojo-services {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .dojo-service-button {
      min-height: 52px;
      padding: 8px;
      border: 1px solid rgba(240, 196, 65, .38);
      border-radius: 8px;
      background: rgba(92, 62, 14, .22);
      color: #ffdc8a;
      font: inherit;
      font-weight: 900;
      text-align: left;
      cursor: pointer;
    }

    .dojo-service-button span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 750;
    }

    .dojo-service-button:disabled {
      border-color: rgba(75, 88, 108, .38);
      background: rgba(18, 23, 32, .54);
      color: rgba(154, 168, 189, .62);
      cursor: default;
    }

    .dojo-resources {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .dojo-resource-card {
      min-height: 96px;
      padding: 12px;
      border: 1px solid rgba(45, 58, 80, .9);
      border-radius: 8px;
      background: rgba(8, 12, 18, .82);
    }

    .dojo-resource-card strong {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
    }

    .dojo-resource-card .value {
      display: block;
      margin-top: 10px;
      color: #43c383;
      font-size: 38px;
      font-weight: 950;
      line-height: 1;
    }

    .dojo-resource-card.credit .value {
      color: #f0c441;
    }

    #pauseOverlay .menu-panel {
      grid-template-columns: minmax(340px, 1fr) minmax(320px, 390px);
      align-items: start;
    }

    #pauseOverlay .character-card {
      min-height: 0;
      padding: 14px;
    }

    .dojo-potion-bar {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 2;
      display: inline-grid;
      grid-template-columns: repeat(10, 7px);
      gap: 3px;
      margin: 0;
      padding: 6px 8px;
      border: 1px solid rgba(240, 196, 65, .48);
      border-radius: 8px;
      background: rgba(92, 62, 14, .35);
    }

    .dojo-potion-dot {
      width: 7px;
      height: 15px;
      border: 1px solid rgba(240, 196, 65, .3);
      border-radius: 5px;
      background: rgba(240, 196, 65, .08);
    }

    .dojo-potion-dot.active {
      border-color: rgba(255, 220, 138, .85);
      background: #ffdc8a;
      box-shadow:
        0 0 8px rgba(255, 220, 138, .8),
        inset 0 0 6px rgba(255, 255, 255, .35);
    }

    #pauseOverlay .character-art {
      height: 365px;
      margin-bottom: 12px;
    }

    #pauseOverlay .menu-actions {
      margin-top: 12px;
    }

    .title-confirm {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: none;
      place-items: center;
      background: rgba(0, 0, 0, .54);
      backdrop-filter: blur(2px);
    }

    .title-confirm.active {
      display: grid;
    }

    .title-confirm-actions {
      display: flex;
      gap: 14px;
      align-items: center;
    }

    .title-confirm button {
      min-width: 160px;
      min-height: 58px;
      border: 1px solid rgba(240, 196, 65, .78);
      border-radius: 8px;
      background: rgba(92, 62, 14, .72);
      color: #ffdc8a;
      font: inherit;
      font-size: 20px;
      font-weight: 950;
      text-transform: uppercase;
      box-shadow: 0 0 24px rgba(240, 196, 65, .22);
      cursor: pointer;
    }

    .title-confirm button.secondary {
      border-color: rgba(0, 229, 255, .46);
      background: rgba(5, 12, 18, .78);
      color: var(--line);
      box-shadow: 0 0 18px rgba(0, 229, 255, .14);
    }

    .custom-row {
      display: grid;
      grid-template-columns: 72px 1fr 88px;
      gap: 10px;
      align-items: center;
      min-height: 46px;
      padding: 8px;
      border: 1px solid rgba(45, 58, 80, .9);
      border-radius: 8px;
      background: rgba(21, 29, 43, .72);
    }

    .custom-row strong {
      font-size: 13px;

  <script>
    const GAME_W = 1024;

    const canvas = document.querySelector("#game");
    const ctx = canvas.getContext("2d");
    const scanlinePatternCache = new Map();
    const combatOverlay = document.querySelector("#combatOverlay");
    const combatFrame = document.querySelector("#combatFrame");
    const combatResult = document.querySelector("#combatResult");
    const combatResultText = document.querySelector("#combatResultText");
    const combatContinueButton = document.querySelector("#combatContinueButton");
    const encounterFlash = document.querySelector("#encounterFlash");
    const trapFlash = document.querySelector("#trapFlash");
    const titleOverlay = document.querySelector("#titleOverlay");
    const pauseOverlay = document.querySelector("#pauseOverlay");
    const runnerNameInput = document.querySelector("#runnerNameInput");
    const portraitSelect = document.querySelector("#portraitSelect");
    const saveSlotList = document.querySelector("#saveSlotList");
    const dojoProfile = document.querySelector("#dojoProfile");
    const dojoPotionBar = document.querySelector("#dojoPotionBar");
    const titleStatList = document.querySelector("#titleStatList");
    const pauseStatList = document.querySelector("#pauseStatList");
    const pauseResourceList = document.querySelector("#pauseResourceList");
    const startGameButton = document.querySelector("#startGameButton");
    const continueGameButton = document.querySelector("#continueGameButton");
    const resumeButton = document.querySelector("#resumeButton");
    const pauseRestartButton = document.querySelector("#pauseRestartButton");
    const titleConfirm = document.querySelector("#titleConfirm");
    const titleConfirmButton = document.querySelector("#titleConfirmButton");
    const titleCancelButton = document.querySelector("#titleCancelButton");
    const characterImageCache = new Map();

    const BASE_STATS = {

      },

    const state = {

      floor: 1,
      hp: 10,
      potions: 5,
      exp: 0,
      credits: 0,
      meleeSkill: 10,
      shootingSkill: 10,
      agility: 10,
      toughness: 10,
      skills: {
        iaido: 0,
        mindEye: 0,
        dash: 0,
        immovable: 0,
        mizukagami: 0
      },
      playerDebuffs: {
        fog: 0,
        paralyze: 0
      },
      playerDebuffBattles: 0,
      playerDebuffType: "",
      playerName: DEFAULT_PLAYER_NAME,
      archetypeKey: "blade",
      meleeWeaponLevel: 1,
      shootingWeaponLevel: 1,
      jammerLevel: 2,
      mode: "title",
      customStats: {
        meleeSkill: 0,
        shootingSkill: 0,
        agility: 0,
        toughness: 0
      },
      statLevels: {
        meleeSkill: 1,
        shootingSkill: 1,
        agility: 1,
        toughness: 1
      },
      map: [],
      stairs: { x: 1, y: 1 },
      warps: [],
      traps: [],
      log: [],
      showMap: false,
      combatOpen: false,
      encounterPending: false,
      pendingCombatResult: null,
      combatReturnRequested: false,
      saveSlotIndex: null,
      bossDefeatedFloors: new Set(),
      adventureStats: createAdventureStats(),
      gameOver: false
    };

    const colors = {
      bg: "#050505",
      line: "#f2f2f2",
      wall: "#565656",
      wallShade: "rgba(0, 0, 0, 0.18)",
      distantHaze: "rgba(88, 112, 132, 0.12)",
      darkWall: "#252525",
      grid: "#686868",
      mapWall: "#17202b",
      mapFloor: "#b7f0d4",
      mapGrid: "#315163",
      mapPlayer: "#fff6a6",
      mapFacing: "#ff5a4f",
      mapStairs: "#66a3ff",
      panel: "#151d2b",
      panelStrong: "#1c2738",
      panelBorder: "#2d3a50",
      muted: "#9aa8bd",
      hpFill: "#43c383",
      red: "#e33535",
      green: "#38d26e",
      blue: "#4c8cff",
      meleeCommand: "#8ce0b4",
      shootCommand: "#ff9a8a",
      potionActive: "#ffdc8a",
      gold: "#f0c441",
      neonWalls: [
        "#00e5ff",
        "#ff3df2",
        "#7cff4f",
        "#ffb347",
        "#8f7cff",
        "#ff4d6d"
      ]
    };

    const DIRECTION_LABELS = [
      { short: "N", label: "NORTH", jp: "北" },
      { short: "E", label: "EAST", jp: "東" },
      { short: "S", label: "SOUTH", jp: "南" },
      { short: "W", label: "WEST", jp: "西" }
    ];

    function resize() {
      const ratio = window.devicePixelRatio || 1;
      const scale = Math.min(window.innerWidth / GAME_W, window.innerHeight / GAME_H);
      const displayW = Math.floor(GAME_W * scale);
      const displayH = Math.floor(GAME_H * scale);
      const offsetX = (window.innerWidth - displayW) / 2;
      const offsetY = (window.innerHeight - displayH) / 2;
      canvas.width = Math.floor(GAME_W * ratio);
      canvas.height = Math.floor(GAME_H * ratio);
      canvas.style.width = `${displayW}px`;
      canvas.style.height = `${displayH}px`;
      encounterFlash.style.left = `${offsetX + (GAME_W / 2) * scale}px`;
      encounterFlash.style.top = `${offsetY + 107 * scale}px`;
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      draw();
    }

    function randInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function shuffle(list) {
      for (let i = list.length - 1; i > 0; i -= 1) {
        const j = randInt(0, i);
        [list[i], list[j]] = [list[j], list[i]];
      }
      return list;
    }

    function addLog(text) {
      state.log.unshift(text);
      state.log = state.log.slice(0, 4);
    }

    function createAdventureStats() {
      return {
        steps: 0,
        encounters: 0,
        wins: 0,
        losses: 0,
        deepestFloor: 1,
        expEarned: 0,
        creditsEarned: 0,
        potionsFound: 0,
        playerAttacks: 0,
        playerHits: 0,
        meleeAttacks: 0,
        meleeHits: 0,
        shootAttacks: 0,
        shootHits: 0,
        damageDealt: 0,
        damageTaken: 0,
        codeTraceAttempts: 0,
        codeTraceSuccesses: 0,
        phaseLockAttempts: 0,
        phaseLockSuccesses: 0,
        anomalyScanAttempts: 0,
        anomalyScanSuccesses: 0
      };
    }

    function restart() {
      state.playerName = normalizedPlayerName();
      clearCustomStats();
      applyCustomStats();
      state.x = START_X;
      state.y = START_Y;
      state.dir = 1;
      state.floor = 1;
      state.potions = 5;
      state.exp = 0;
      state.credits = 0;
      state.meleeWeaponLevel = 1;
      state.shootingWeaponLevel = 1;
      state.jammerLevel = 2;
      state.skills = {
        iaido: 0,
        mindEye: 0,
        dash: 0,
        immovable: 0,
        mizukagami: 0
      };
      state.playerDebuffs = {
        fog: 0,
        paralyze: 0
      };
      state.playerDebuffBattles = 0;
      state.playerDebuffType = "";
      state.hp = maxHp();
      applyStartingStatLevels();
      state.combatOpen = false;
      state.encounterPending = false;
      state.pendingCombatResult = null;
      state.saveSlotIndex = null;
      state.bossDefeatedFloors = new Set();
      state.adventureStats = createAdventureStats();
      state.gameOver = false;
      state.mode = "playing";
      state.log = [];
      hideTitle();
      hidePause();
      closeCombatPopup();
      startFloor();
    }

    function applyCustomStats() {
      for (const stat of STAT_CONFIG) {
        state[stat.key] = BASE_STATS[stat.key] + totalBonusFor(stat.key);
      }
    }

    function applyStartingStatLevels() {
      for (const stat of STAT_CONFIG) {
        state.statLevels[stat.key] = 1 + totalBonusFor(stat.key);
      }
    }

    function resetCustomStats() {
      clearCustomStats();
      renderTitleMenu();
    }

    function clearCustomStats() {
      for (const stat of STAT_CONFIG) state.customStats[stat.key] = 0;
    }

    function currentArchetype() {
      return ARCHETYPES.find(archetype => archetype.key === state.archetypeKey) || ARCHETYPES[0];
    }

    function currentArchetypeDefaultName() {
      return currentArchetype().defaultName || DEFAULT_PLAYER_NAME;
    }

    function archetypeBonusFor(stat) {
      return currentArchetype().bonus[stat] || 0;
    }

    function totalBonusFor(stat) {
      return archetypeBonusFor(stat);
    }

    function hideTitle() {
      titleOverlay.classList.remove("active");
      titleOverlay.setAttribute("aria-hidden", "true");
    }

    function showTitle() {
      state.mode = "title";
      titleOverlay.classList.add("active");
      titleOverlay.setAttribute("aria-hidden", "false");
      renderTitleMenu();
      draw();
    }

    function reborn() {
      hideTitleConfirm();
      closeCombatPopup();
      hidePause();
      showTitle();
    }

    function showTitleConfirm() {
      titleConfirm.classList.add("active");
      titleConfirm.setAttribute("aria-hidden", "false");
      titleConfirmButton.focus();
    }

    function hideTitleConfirm() {
      titleConfirm.classList.remove("active");
      titleConfirm.setAttribute("aria-hidden", "true");
    }

    function showPause() {
      if (state.mode !== "playing" || state.combatOpen || state.gameOver) return;
      state.mode = "paused";
      pauseOverlay.classList.add("active");
      pauseOverlay.setAttribute("aria-hidden", "false");
      renderPauseMenu();
      draw();
    }

    function hidePause() {
      hideTitleConfirm();
      pauseOverlay.classList.remove("active");
      pauseOverlay.setAttribute("aria-hidden", "true");
    }

    function resumeGame() {
      if (state.mode !== "paused") return;
      state.mode = "playing";
      hidePause();
      draw();
    }

    function togglePause() {
      if (state.mode === "paused") {
        resumeGame();
      } else {
        showPause();
      }
    }

    function startFloor() {
      generateDungeon();
      placeStairs();
      placeSpecialTiles();
      addLog(`B${state.floor}F: dungeon starts.`);
      draw();
    }

    function generateDungeon() {
      state.map = Array.from({ length: MAP_H }, () => Array(MAP_W).fill(WALL));
      carveMaze(START_X, START_Y);
      addLoopConnections();
      state.x = START_X;
      state.y = START_Y;
      state.dir = 1;
    }

    function carveMaze(cx, cy) {
      state.map[cy][cx] = FLOOR;
      const dirs = shuffle([
        { x: 0, y: -2 },
        { x: 2, y: 0 },
        { x: 0, y: 2 },
        { x: -2, y: 0 }
      ]);

      for (const d of dirs) {
        const nx = cx + d.x;
        const ny = cy + d.y;
        if (nx <= 0 || nx >= MAP_W - 1 || ny <= 0 || ny >= MAP_H - 1) continue;
        if (state.map[ny][nx] === FLOOR) continue;
        state.map[cy + d.y / 2][cx + d.x / 2] = FLOOR;
        carveMaze(nx, ny);
      }
    }

    function addLoopConnections() {
      for (let y = 1; y < MAP_H - 1; y += 1) {
        for (let x = 1; x < MAP_W - 1; x += 1) {
          if (state.map[y][x] !== WALL) continue;

          const connectsHorizontal = state.map[y][x - 1] === FLOOR && state.map[y][x + 1] === FLOOR;
          const connectsVertical = state.map[y - 1][x] === FLOOR && state.map[y + 1][x] === FLOOR;

          if (
            (connectsHorizontal || connectsVertical) &&
            !wouldCreateWideFloor(x, y) &&
            Math.random() < LOOP_CONNECTION_RATE
          ) {
            state.map[y][x] = FLOOR;
          }
        }
      }
    }

    function wouldCreateWideFloor(x, y) {
      for (let oy = -1; oy <= 0; oy += 1) {
        for (let ox = -1; ox <= 0; ox += 1) {
          let floorCount = 0;

          for (let yy = 0; yy <= 1; yy += 1) {
            for (let xx = 0; xx <= 1; xx += 1) {
              const tx = x + ox + xx;
              const ty = y + oy + yy;
              const isCandidate = tx === x && ty === y;

              if (isCandidate || state.map[ty][tx] === FLOOR) {
                floorCount += 1;
              }
            }
          }

          if (floorCount === 4) return true;
        }
      }

      return false;
    }

    function isWall(x, y) {
      if (y < 0 || y >= state.map.length) return true;
      if (x < 0 || x >= state.map[y].length) return true;
      return state.map[y][x] === WALL;
    }

    function placeStairs() {
      let best = { x: 1, y: 1 };
      let bestDist = -1;
      for (let y = 0; y < MAP_H; y += 1) {
        for (let x = 0; x < MAP_W; x += 1) {
          if (isWall(x, y)) continue;
          const dist = Math.abs(x - state.x) + Math.abs(y - state.y);
          if (dist > bestDist) {
            bestDist = dist;
            best = { x, y };
          }
        }
      }
      state.stairs = best;
    }

    function placeSpecialTiles() {
      state.warps = [];
      state.traps = [];
      const blocked = new Set([posKey({ x: state.x, y: state.y }), posKey(state.stairs)]);
      for (let index = 0; index < WARP_TILE_COUNT; index += 1) {
        const tile = randomOpenTile(blocked);
        if (tile) {
          state.warps.push(tile);
          blocked.add(posKey(tile));
        }
      }
      for (let index = 0; index < TRAP_TILE_COUNT; index += 1) {
        const tile = randomOpenTile(blocked);
        if (tile) {
          state.traps.push(tile);
          blocked.add(posKey(tile));
        }
      }
    }

    function randomOpenTile(blocked = new Set()) {
      const candidates = [];
      for (let y = 1; y < MAP_H - 1; y += 1) {
        for (let x = 1; x < MAP_W - 1; x += 1) {
          const pos = { x, y };
          if (isWall(x, y) || blocked.has(posKey(pos))) continue;
          if (Math.abs(x - state.x) + Math.abs(y - state.y) < 6) continue;
          candidates.push(pos);
        }
      }
      if (!candidates.length) return null;
      return candidates[Math.floor(Math.random() * candidates.length)];
    }

    function posKey(pos) {
      return `${pos.x},${pos.y}`;
    }

    function tileIndexAt(list, pos) {
      return list.findIndex(tile => same(tile, pos));
    }

    function same(a, b) {
      return a.x === b.x && a.y === b.y;
    }

    function normalizedSkillLevel(value) {
      if (typeof value === "number") return Math.max(0, Math.min(MAX_SKILL_LEVEL, Math.floor(value)));
      return value ? 1 : 0;
    }

    function normalizedSkillLevels(skills = {}) {
      return {
        iaido: normalizedSkillLevel(skills.iaido),
        mindEye: normalizedSkillLevel(skills.mindEye),
        dash: normalizedSkillLevel(skills.dash),
        immovable: normalizedSkillLevel(skills.immovable),
        mizukagami: normalizedSkillLevel(skills.mizukagami)
      };
    }

    function skillLevel(skill) {
      return normalizedSkillLevel(state.skills?.[skill]);
    }

    function skillUpgradeCost(skill) {
      return SKILL_EXP_COSTS[skillLevel(skill)] || 0;
    }

    function skillMastered(skill) {
      return skillLevel(skill) >= MAX_SKILL_LEVEL;
    }

    function canRevealHazards() {
      return skillLevel("mindEye") >= 2;
    }

    function normalizePlayerDebuffs(data = {}) {
      const debuffs = {
        fog: Math.max(0, Number.parseInt(data.fog, 10) || 0),
        paralyze: Math.max(0, Number.parseInt(data.paralyze, 10) || 0)
      };
      return debuffs;
    }

    function syncLegacyPlayerDebuff() {
      const entries = Object.entries(state.playerDebuffs || {})
        .filter(([, turns]) => turns > 0)
        .sort((a, b) => b[1] - a[1]);
      state.playerDebuffType = entries[0]?.[0] || "";
      state.playerDebuffBattles = entries[0]?.[1] || 0;
    }

    function migrateLegacyPlayerDebuff(data = {}) {
      const debuffs = normalizePlayerDebuffs(data.playerDebuffs || {});
      if (data.playerDebuffType && data.playerDebuffBattles > 0) {
        debuffs[data.playerDebuffType] = Math.max(debuffs[data.playerDebuffType] || 0, data.playerDebuffBattles);
      }
      return debuffs;
    }

    function dirVector() {
      return [
        { x: 0, y: -1 },
        { x: 1, y: 0 },
        { x: 0, y: 1 },
        { x: -1, y: 0 }
      ][state.dir];
    }

    function relativePos(side, forward) {
      const f = dirVector();
      const r = { x: -f.y, y: f.x };
      return {
        x: state.x + f.x * forward + r.x * side,
        y: state.y + f.y * forward + r.y * side
      };
    }

    function tryMove(pos) {
      if (state.encounterPending || state.showMap) return false;
      if (isWall(pos.x, pos.y)) {
        addLog("A wall blocks the way.");
        draw();
        return false;
      }
      state.x = pos.x;
      state.y = pos.y;
      state.adventureStats.steps += 1;
      playFootstepSound();
      resolveSpecialTile(pos);
      const currentPos = { x: state.x, y: state.y };
      if (same(currentPos, state.stairs)) {
        beginDescend();
        return false;
      }
      if (isStartTile(currentPos)) {
        activateSavePoint();
        draw();
        return true;
      }
      if (isNextToStairs(currentPos) && !bossDefeatedOnCurrentFloor()) {
        addLog("A powerful guardian blocks the stairs.");
        beginEncounter("boss");
      } else {
        checkRandomEncounter();
      }
      draw();
      return true;
    }

    function isNextToStairs(pos) {
      return Math.abs(pos.x - state.stairs.x) + Math.abs(pos.y - state.stairs.y) === 1;
    }

    function isStartTile(pos = { x: state.x, y: state.y }) {
      return pos.x === START_X && pos.y === START_Y;
    }

    function isWarpTile(pos) {
      return tileIndexAt(state.warps, pos) >= 0;
    }

    function isTrapTile(pos) {
      return tileIndexAt(state.traps, pos) >= 0;
    }

    function activateSavePoint({ popup = true } = {}) {
      if (popup) showEventPopup("SAVE");
      saveGame();
    }

    function saveIfOnStartTile() {
      if (!isStartTile() || state.combatOpen || state.encounterPending) return;
      saveGame();
    }

    function bossDefeatedOnCurrentFloor() {
      return state.bossDefeatedFloors.has(state.floor);
    }

    function markBossDefeatedOnCurrentFloor() {
      state.bossDefeatedFloors.add(state.floor);
    }

    function checkRandomEncounter() {
      const rate = ENCOUNTER_RATE;
      if (Math.random() >= rate) return;

      addLog("A wandering enemy appears.");
      beginEncounter();
    }

    function resolveSpecialTile(pos) {
      const warpIndex = tileIndexAt(state.warps, pos);
      if (warpIndex >= 0) {
        state.warps.splice(warpIndex, 1);
        const blocked = new Set([posKey(pos), posKey(state.stairs), ...state.traps.map(posKey)]);
        const target = randomOpenTile(blocked);
        if (target) {
          state.x = target.x;
          state.y = target.y;
          showEventPopup("WARP");
          addLog("Warp tile activated. Position scrambled.");
        }
        return;
      }

      const trapIndex = tileIndexAt(state.traps, pos);
      if (trapIndex >= 0) {
        state.traps.splice(trapIndex, 1);
        const type = Math.random() < 0.5 ? "fog" : "paralyze";
        state.playerDebuffs[type] = (state.playerDebuffs[type] || 0) + TRAP_DEBUFF_BATTLES;
        syncLegacyPlayerDebuff();
        showEventPopup("TRAP");
        triggerTrapFlash();
        addLog(`Trap tile activated. ${type.toUpperCase()} +${TRAP_DEBUFF_BATTLES} battles.`);
      }
    }

    function showEventPopup(label) {
      encounterFlash.textContent = label;
      encounterFlash.classList.remove("active");
      void encounterFlash.offsetWidth;
      encounterFlash.classList.add("active");
      window.setTimeout(() => encounterFlash.classList.remove("active"), 1000);
    }

    function triggerTrapFlash() {
      trapFlash.classList.remove("active");
      void trapFlash.offsetWidth;
      trapFlash.classList.add("active");
      window.setTimeout(() => trapFlash.classList.remove("active"), 720);
    }

    function beginEncounter(enemyStrength = "") {
      if (state.encounterPending || state.combatOpen) return;
      state.encounterPending = true;
      playEncounterSound();
      showEventPopup(enemyStrength === "boss" ? "BOSS" : "ENCOUNTER");
      window.setTimeout(() => {
        state.encounterPending = false;
        openCombatPopup(enemyStrength);
      }, 1000);
      draw();
    }

    function beginDescend() {
      if (state.encounterPending || state.combatOpen) return;
      state.encounterPending = true;
      showEventPopup("DESCEND");
      window.setTimeout(() => {
        state.encounterPending = false;
        descend();
      }, 1000);
      draw();
    }

    function openCombatPopup(enemyStrength = "") {
      state.combatOpen = true;
      state.pendingCombatResult = null;
      state.combatReturnRequested = false;
      state.adventureStats.encounters += 1;
      combatResult.classList.remove("active");
      combatOverlay.classList.add("active");
      combatOverlay.setAttribute("aria-hidden", "false");
      const params = new URLSearchParams({
        floor: state.floor,
        meleeSkill: state.meleeSkill,
        shootingSkill: state.shootingSkill,
        agility: state.agility,
        toughness: state.toughness,
        meleeWeaponDamage: meleeWeaponDamage(),
        shootingWeaponDamage: shootingWeaponDamage(),
        meleeWeaponName: weaponDisplayName("melee"),
        shootingWeaponName: weaponDisplayName("shoot"),
        jammerLevel: state.jammerLevel,
        playerName: state.playerName,
        hp: state.hp,
        potions: state.potions,
        iaido: skillLevel("iaido"),
        mindEye: skillLevel("mindEye"),
        dash: skillLevel("dash"),
        immovable: skillLevel("immovable"),
        mizukagami: skillLevel("mizukagami"),
        playerDebuff: (state.playerDebuffs.fog > 0 || state.playerDebuffs.paralyze > 0) ? 1 : 0,
        playerDebuffBattles: state.playerDebuffBattles,
        playerDebuffType: state.playerDebuffType,
        playerFogBattles: state.playerDebuffs.fog || 0,
        playerParalyzeBattles: state.playerDebuffs.paralyze || 0,
        enemyStrength,
        t: Date.now()
      });
      combatFrame.src = `combat-system-mobile.html?${params.toString()}`;
      draw();
    }

    function focusCombatFrame() {
      if (!state.combatOpen) return;
      combatFrame.focus();
      combatFrame.contentWindow?.focus();
    }

    function closeCombatPopup() {
      combatOverlay.classList.remove("active");
      combatOverlay.setAttribute("aria-hidden", "true");
      combatResult.classList.remove("active");
      combatFrame.removeAttribute("src");
      restoreDungeonFocus();
    }

    function restoreDungeonFocus() {
      window.focus();
      canvas.focus({ preventScroll: true });
    }

    function showCombatResult(result) {
      state.pendingCombatResult = result;
      combatResultText.textContent = "";
      combatResult.classList.add("active");
      combatContinueButton.focus({ preventScroll: true });
      if (state.combatReturnRequested) finishCombatPopup();
    }

    function finishCombatPopup() {
      const result = state.pendingCombatResult;
      if (!result) return;

      state.combatOpen = false;
      state.pendingCombatResult = null;
      state.combatReturnRequested = false;
      closeCombatPopup();
      mergeBattleStats(result.battleStats);

      if (result.outcome === "win") {
        state.adventureStats.wins += 1;
        if (result.enemyStrength === "boss") {
          markBossDefeatedOnCurrentFloor();
          addLog(`B${state.floor}F guardian defeated.`);
        }
        state.hp = maxHp();
        if (Number.isFinite(result.playerPotions)) {
          state.potions = clampPotions(result.playerPotions);
        }
        const reward = rewardForCombat(result);
        state.exp += reward.exp;
        state.credits += reward.credits;
        state.adventureStats.expEarned += reward.exp;
        state.adventureStats.creditsEarned += reward.credits;
        addLog(`Enemy defeated. EXP +${reward.exp} / CREDIT +${reward.credits}.`);
      } else {
        state.adventureStats.losses += 1;
        state.hp = 0;
        state.gameOver = true;
        addLog("You fall in the dungeon.");
      }
      const clearedDebuffs = [];
      for (const type of ["fog", "paralyze"]) {
        if ((state.playerDebuffs[type] || 0) > 0) {
          state.playerDebuffs[type] -= 1;
          if (state.playerDebuffs[type] === 0) clearedDebuffs.push(type.toUpperCase());
        }
      }
      syncLegacyPlayerDebuff();
      if (clearedDebuffs.length > 0) {
        addLog(`Trap jamming cleared: ${clearedDebuffs.join(" / ")}.`);
      }
      draw();
    }

    function rewardForCombat(result) {
      const strength = result.enemyStrength || "even";
      const base = REWARD_BY_ENEMY_STRENGTH[strength] || REWARD_BY_ENEMY_STRENGTH.even;
      const stats = result.enemyStats || {};
      const damage = result.enemyDamage || {};
      const statScore =
        safeNumber(stats.meleeSkill) +
        safeNumber(stats.shootingSkill) +
        safeNumber(stats.agility) +
        safeNumber(stats.toughness);
      const damageScore = safeNumber(damage.melee) + safeNumber(damage.shoot);
      const hackScore = safeNumber(result.enemyHackLevel);
      const floorBonus = Math.max(0, state.floor - 1);
      const strengthBonus = { weak: 0, even: 3, strong: 7, boss: 14 }[strength] || 3;
      return {
        label: base.label,
        exp: Math.max(base.exp, Math.round(5 + statScore / 17 + damageScore + hackScore + strengthBonus + floorBonus * 0.9)),
        credits: Math.max(base.credits, Math.round(10 + statScore / 9.5 + damageScore * 2 + hackScore + strengthBonus + floorBonus * 2.15 + randInt(state.floor, state.floor * 2)))
      };
    }

    function safeNumber(value) {
      return Number.isFinite(value) ? value : 0;
    }

    function mergeBattleStats(battleStats = {}) {
      const keys = [
        "playerAttacks",
        "playerHits",
        "meleeAttacks",
        "meleeHits",
        "shootAttacks",
        "shootHits",
        "damageDealt",
        "damageTaken",
        "codeTraceAttempts",
        "codeTraceSuccesses",
        "phaseLockAttempts",
        "phaseLockSuccesses",
        "anomalyScanAttempts",
        "anomalyScanSuccesses"
      ];
      for (const key of keys) {
        state.adventureStats[key] += Number.isFinite(battleStats[key]) ? battleStats[key] : 0;
      }
    }

    let audioContext;

    function getAudioContext() {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return null;
      if (!audioContext) audioContext = new AudioContextClass();
      if (audioContext.state === "suspended") audioContext.resume();
      return audioContext;
    }

    function createNoiseBuffer(context, duration) {
      const buffer = context.createBuffer(1, context.sampleRate * duration, context.sampleRate);
      const data = buffer.getChannelData(0);
      for (let index = 0; index < data.length; index += 1) {
        data[index] = Math.random() * 2 - 1;
      }
      return buffer;
    }

    function playFootstepSound() {
      const context = getAudioContext();
      if (!context) return;

      [0, 0.11].forEach((offset) => {
        const now = context.currentTime + offset;
        const noise = context.createBufferSource();
        const filter = context.createBiquadFilter();
        const gain = context.createGain();

        noise.buffer = createNoiseBuffer(context, 0.08);
        filter.type = "lowpass";
        filter.frequency.setValueAtTime(210, now);
        filter.Q.setValueAtTime(0.7, now);

        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(0.22, now + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.08);

        noise.connect(filter).connect(gain).connect(context.destination);
        noise.start(now);
        noise.stop(now + 0.09);
      });
    }

    function playEncounterSound() {
      const context = getAudioContext();
      if (!context) return;

      const now = context.currentTime;
      [0, 0.1, 0.2].forEach((offset, index) => {
        const oscillator = context.createOscillator();
        const gain = context.createGain();
        oscillator.type = "square";
        oscillator.frequency.setValueAtTime(220 + index * 95, now + offset);
        gain.gain.setValueAtTime(0.0001, now + offset);
        gain.gain.exponentialRampToValueAtTime(0.18, now + offset + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + offset + 0.09);
        oscillator.connect(gain).connect(context.destination);
        oscillator.start(now + offset);
        oscillator.stop(now + offset + 0.1);
      });
    }

    function usePotion() {
      if (state.potions <= 0) {
        addLog("No potion.");
        draw();
        return;
      }
      if (state.hp >= maxHp()) {
        addLog("HP already full.");
        draw();
        return;
      }
      state.potions -= 1;
      state.hp = Math.min(maxHp(), state.hp + 12);
      addLog("Potion heals 12.");
      saveIfOnStartTile();
      draw();
    }

    function buyPotion() {
      if (state.potions >= MAX_POTIONS) {
        addLog("Potion stock is full.");
        draw();
        return;
      }
      if (state.credits < POTION_PRICE) {
        addLog(`Need ${POTION_PRICE} credits to buy a potion.`);
        draw();
        return;
      }

      state.credits -= POTION_PRICE;
      state.potions = clampPotions(state.potions + 1);
      addLog(`Potion purchased. CREDIT -${POTION_PRICE}.`);
      saveIfOnStartTile();
      draw();
    }

    function clampPotions(value) {
      return Math.max(0, Math.min(MAX_POTIONS, Math.floor(value)));
    }

    function toggleMap() {
      if (state.showMap) {
        state.showMap = false;
        draw();
        return;
      }

      if (state.credits < MAP_PRICE) {
        addLog(`Need ${MAP_PRICE} credits to request radar scan.`);
        draw();
        return;
      }

      state.credits -= MAP_PRICE;
      state.showMap = true;
      addLog(`Radar scan complete. CREDIT -${MAP_PRICE}.`);
      saveIfOnStartTile();
      draw();
    }

    function trainStat(stat) {
      const labels = {
        meleeSkill: "近接",
        shootingSkill: "射撃",
        agility: "敏捷",
        toughness: "頑強"
      };
      const level = state.statLevels[stat];
      const cost = trainingCostFor(stat);

      if (state[stat] >= STAT_CAP) {
        addLog(`${labels[stat]} is already capped.`);
        draw();
        return;
      }

      if (state.exp < cost) {
        addLog(`Need ${cost} EXP to raise ${labels[stat]} to Lv${level + 1}.`);
        draw();
        return;
      }

      state.exp -= cost;
      state[stat] += 1;
      state.statLevels[stat] += 1;
      if (stat === "toughness") {
        state.hp = Math.min(maxHp(), state.hp + 1);
      }
      addLog(`${labels[stat]} Lv${state.statLevels[stat]}. EXP -${cost}.`);
      saveIfOnStartTile();
      draw();
    }

    function upgradeWeapon(kind) {
      const isMelee = kind === "melee";
      const isJammer = kind === "jammer";
      const levelKey = isJammer ? "jammerLevel" : isMelee ? "meleeWeaponLevel" : "shootingWeaponLevel";
      const label = isJammer ? "JAMMER" : isMelee ? MELEE_WEAPON_NAME : SHOOTING_WEAPON_NAME;
      const cost = weaponUpgradeCost(state[levelKey]);

      if (state[levelKey] >= MAX_WEAPON_LEVEL) {
        addLog(`${label} is already at maximum upgrade.`);
        draw();
        return;
      }

      if (state.credits < cost) {
        addLog(`Need ${cost} credits to upgrade ${label}.`);
        draw();
        return;
      }

      state.credits -= cost;
      state[levelKey] += 1;
      addLog(`${isJammer ? jammerDisplayName() : weaponDisplayName(kind)} upgraded. CREDIT -${cost}.`);
      saveIfOnStartTile();
      draw();
    }

    function weaponUpgradeCost(level) {
      const costs = [300, 500, 800, 1100, 1500, 2000];
      return costs[Math.max(0, Math.min(costs.length - 1, level - 1))];
    }

    function learnSkill(skill) {
      const labels = {
        iaido: "居合",
        mindEye: "心眼",
        dash: "疾駆",
        immovable: "不動",
        mizukagami: "水鏡"
      };
      const currentLevel = skillLevel(skill);
      if (currentLevel >= MAX_SKILL_LEVEL) {
        addLog(`${labels[skill]}はすでに最終段階。`);
        draw();
        return;
      }
      const cost = skillUpgradeCost(skill);
      if (state.exp < cost) {
        addLog(`${labels[skill]} Lv${currentLevel + 1}には${cost} EXPが必要。`);
        draw();
        return;
      }

      state.exp -= cost;
      state.skills[skill] = currentLevel + 1;
      addLog(`${labels[skill]} Lv${currentLevel + 1}を会得。EXP -${cost}.`);
      saveIfOnStartTile();
      draw();
    }

    function weaponPlusText(level) {
      return level <= 1 ? "" : ` +${level - 1}`;
    }

    function weaponDisplayName(kind) {
      const isMelee = kind === "melee";
      const name = isMelee ? MELEE_WEAPON_NAME : SHOOTING_WEAPON_NAME;
      const level = isMelee ? state.meleeWeaponLevel : state.shootingWeaponLevel;
      return `${name}${weaponPlusText(level)}`;
    }

    function weaponNextDisplayName(kind) {
      const isMelee = kind === "melee";
      const name = isMelee ? MELEE_WEAPON_NAME : SHOOTING_WEAPON_NAME;
      const currentLevel = isMelee ? state.meleeWeaponLevel : state.shootingWeaponLevel;
      if (currentLevel >= MAX_WEAPON_LEVEL) return "MAX";
      const level = currentLevel + 1;
      return `${name}${weaponPlusText(level)}`;
    }

    function jammerBonusSeconds(level = state.jammerLevel) {
      return Math.max(0, level - 1) * 0.5;
    }

    function jammerHitPenaltyBonus(level = state.jammerLevel) {
      return Math.max(0, level - 1) * 2;
    }

    function jammerDisplayName() {
      return `JAMMER${weaponPlusText(state.jammerLevel)}`;
    }

    function meleeWeaponDamage() {
      return MELEE_WEAPON_BASE_DAMAGE + state.meleeWeaponLevel - 1;
    }

    function shootingWeaponDamage() {
      return SHOOTING_WEAPON_BASE_DAMAGE + state.shootingWeaponLevel - 1;
    }

    function maxHp() {
      return state.toughness;
    }

    function trainingCostFor(stat) {
      return 40 + state.statLevels[stat] * 20;
    }

    function descend() {
      state.showMap = false;
      state.floor += 1;
      state.adventureStats.deepestFloor = Math.max(state.adventureStats.deepestFloor, state.floor);
      state.hp = Math.min(maxHp(), state.hp + 2);
      startFloor();
      saveGame();
      draw();
    }

    function renderTitleMenu() {
      applyPortraitArt();
      if (document.activeElement !== runnerNameInput) {
        runnerNameInput.value = normalizedPlayerName();
      }
      portraitSelect.innerHTML = portraitSelectHtml();
      continueGameButton.disabled = !hasSavedGame();
      saveSlotList.innerHTML = saveSlotsHtml();
      titleStatList.innerHTML = statListHtml(titleStatsSnapshot());
    }

    function hasSavedGame() {
      return saveSlots().some(Boolean);
    }

    function saveSlotKey(index) {
      return `${SAVE_KEY}-slot-${index + 1}`;
    }

    function readSaveSlot(index) {
      try {
        const raw = localStorage.getItem(saveSlotKey(index));
        if (raw) return JSON.parse(raw);
        if (index === 0) {
          const legacy = localStorage.getItem(SAVE_KEY);
          return legacy ? JSON.parse(legacy) : null;
        }
      } catch (error) {
        return null;
      }
      return null;
    }

    function saveSlots() {
      return Array.from({ length: SAVE_SLOT_COUNT }, (_, index) => readSaveSlot(index));
    }

    function firstEmptySaveSlotIndex() {
      return saveSlots().findIndex(slot => !slot);
    }

    function latestSavedSlotIndex() {
      const slots = saveSlots();
      let latestIndex = -1;
      let latestSavedAt = -1;
      slots.forEach((slot, index) => {
        if (!slot) return;
        const savedAt = Number(slot.savedAt || 0);
        if (savedAt > latestSavedAt) {
          latestSavedAt = savedAt;
          latestIndex = index;
        }
      });
      return latestIndex;
    }

    function saveSlotSummary(slot, index) {
      if (!slot) return `<strong>SLOT ${index + 1}</strong><span>EMPTY</span>`;
      const saved = slot.savedAt ? new Date(slot.savedAt).toLocaleString() : "UNKNOWN TIME";
      return `
        <strong class="save-slot-title">
          <span>SLOT ${index + 1} / ${escapeHtml(slot.playerName || DEFAULT_PLAYER_NAME)} / B${slot.floor || 1}F</span>
          <time>${saved}</time>
        </strong>
        ${saveSlotStatsHtml(slot)}
      `;
    }

    function saveSlotStatsHtml(slot) {
      const stats = STAT_CONFIG.map(stat => {
        const value = slot?.[stat.key] ?? BASE_STATS[stat.key];
        return `<span class="portrait-stat"><strong>${stat.short}</strong><span>${value}</span></span>`;
      }).join("");
      return `<span class="portrait-stats">${stats}</span>`;
    }

    function saveSlotPortraitHtml(slot) {
      if (!slot) return `<span class="save-slot-portrait empty" aria-hidden="true"></span>`;
      const archetype = ARCHETYPES.find(item => item.key === slot.archetypeKey) || ARCHETYPES[0];
      return `<span class="save-slot-portrait" style="--save-slot-portrait: url('${archetype.file}')" aria-hidden="true"></span>`;
    }

    function saveSlotsHtml() {
      return saveSlots().map((slot, index) => `
        <div class="save-slot">
          ${saveSlotPortraitHtml(slot)}
          <div class="save-slot-main">${saveSlotSummary(slot, index)}</div>
          <button type="button" data-save-load="${index}" ${slot ? "" : "disabled"}>LOAD</button>
          <button class="delete" type="button" data-save-delete="${index}" ${slot ? "" : "disabled"}>DELETE</button>
        </div>
      `).join("");
    }

    function saveGame() {
      let slotIndex = state.saveSlotIndex;
      if (slotIndex === null || slotIndex < 0 || slotIndex >= SAVE_SLOT_COUNT) {
        slotIndex = firstEmptySaveSlotIndex();
      }
      if (slotIndex < 0) {
        addLog("Auto save skipped. No empty save slot.");
        return false;
      }
      state.saveSlotIndex = slotIndex;
      const data = {
        version: 1,
        savedAt: Date.now(),
        x: state.x,
        y: state.y,
        dir: state.dir,
        floor: state.floor,
        hp: state.hp,
        potions: state.potions,
        exp: state.exp,
        credits: state.credits,
        meleeSkill: state.meleeSkill,
        shootingSkill: state.shootingSkill,
        agility: state.agility,
        toughness: state.toughness,
        skills: { ...state.skills },
        playerDebuffs: { ...state.playerDebuffs },
        playerDebuffBattles: state.playerDebuffBattles,
        playerDebuffType: state.playerDebuffType,
        playerName: state.playerName,
        archetypeKey: state.archetypeKey,
        meleeWeaponLevel: state.meleeWeaponLevel,
        shootingWeaponLevel: state.shootingWeaponLevel,
        jammerLevel: state.jammerLevel,
        customStats: { ...state.customStats },
        statLevels: { ...state.statLevels },
        map: state.map,
        stairs: { ...state.stairs },
        warps: state.warps.map(tile => ({ ...tile })),
        traps: state.traps.map(tile => ({ ...tile })),
        log: [...state.log],
        adventureStats: { ...state.adventureStats },
        bossDefeatedFloors: [...state.bossDefeatedFloors]
      };
      try {
        localStorage.setItem(saveSlotKey(slotIndex), JSON.stringify(data));
        if (slotIndex === 0) localStorage.removeItem(SAVE_KEY);
        addLog(`B${state.floor}F: auto saved to slot ${slotIndex + 1}.`);
        return true;
      } catch (error) {
        addLog("Auto save failed.");
        return false;
      }
    }

    function deleteSaveSlot(index) {
      try {
        localStorage.removeItem(saveSlotKey(index));
        if (index === 0) localStorage.removeItem(SAVE_KEY);
      } catch (error) {
        return;
      }
      if (state.saveSlotIndex === index) state.saveSlotIndex = null;
      renderTitleMenu();
    }

    function continueSavedGame(slotIndex = latestSavedSlotIndex()) {
      const data = Number.isInteger(slotIndex) && slotIndex >= 0 ? readSaveSlot(slotIndex) : null;
      if (!data || data.version !== 1) return;

      state.saveSlotIndex = slotIndex;
      state.floor = data.floor;
      state.hp = data.hp;
      state.potions = data.potions;
      state.exp = data.exp;
      state.credits = data.credits;
      state.meleeSkill = data.meleeSkill;
      state.shootingSkill = data.shootingSkill;
      state.agility = data.agility;
      state.toughness = data.toughness;
      state.skills = normalizedSkillLevels({ ...state.skills, ...data.skills });
      state.playerDebuffs = migrateLegacyPlayerDebuff(data);
      syncLegacyPlayerDebuff();
      state.playerName = data.playerName || DEFAULT_PLAYER_NAME;
      state.archetypeKey = data.archetypeKey || "blade";
      state.meleeWeaponLevel = data.meleeWeaponLevel || 1;
      state.shootingWeaponLevel = data.shootingWeaponLevel || 1;
      state.jammerLevel = Number.isFinite(data.jammerLevel) ? data.jammerLevel : 2;
      state.customStats = { ...state.customStats, ...data.customStats };
      state.statLevels = { ...state.statLevels, ...data.statLevels };
      state.log = Array.isArray(data.log) ? data.log : [];
      state.adventureStats = { ...createAdventureStats(), ...data.adventureStats };
      state.bossDefeatedFloors = new Set(Array.isArray(data.bossDefeatedFloors) ? data.bossDefeatedFloors : []);
      generateDungeon();
      placeStairs();
      placeSpecialTiles();
      state.showMap = false;
      state.combatOpen = false;
      state.encounterPending = false;
      state.pendingCombatResult = null;
      state.combatReturnRequested = false;
      state.gameOver = false;
      state.mode = "playing";
      applyPortraitArt();
      hideTitle();
      hidePause();
      closeCombatPopup();
      addLog(`B${state.floor}F: save resumed. New dungeon generated.`);
      draw();
      restoreDungeonFocus();
    }

          : capped ? `DMG ${weapon.damage} / 調整完了` : `DMG ${weapon.damage} -> ${weapon.damage + 1}`;

        });

      const skillConfig = [

        ["mindEye", "心眼", ["距離3 +15 / 距離4 +10", "罠/ワープ視認", "距離3 +25 / 距離4 +20"]],
        ["dash", "疾駆", ["移動力2", "移動力3", "必ず先制"]],
        ["immovable", "不動", ["ノックバック無効50%", "ノックバック無効75%", "ノックバック無効100%"]],
        ["mizukagami", "水鏡", ["近接被弾時30%反撃", "近接被弾時50%反撃", "近接被弾時70%反撃"]]

      const skillButtons = skillConfig.map(([key, label, notes]) => {

        return dojoButtonHtml({
          kind: "skill",

    function dojoButtonHtml({ kind, target, label, note, cost, enabled, complete = "" }) {

    function earnedBadges() {

      if (state.adventureStats.wins >= 100) badges.push("SLAYER 100");
      if (STAT_CONFIG.every(stat => state[stat.key] >= STAT_CAP)) badges.push("MASTER");
      return badges;

    function earnedBadgesText() {

    function titleStatsSnapshot() {

      }));

    function normalizedPlayerName() {
      const value = (runnerNameInput?.value || state.playerName || currentArchetypeDefaultName()).trim();
      return value.slice(0, 12) || currentArchetypeDefaultName();
    }

    function currentStatsSnapshot() {
      return STAT_CONFIG.map(stat => ({
        label: stat.label,

    function statListHtml(entries) {

    }

    function menuStatHtml(label, value, note) {
      return `
        <div class="menu-stat">
          <strong>${label}</strong>
          <span>${note}</span>
          <span class="value">${value}</span>

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function draw() {
      const w = GAME_W;
      const h = GAME_H;
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = colors.bg;
      ctx.fillRect(0, 0, w, h);
      drawView(w, h);
      drawFacingCompass(w, h);
      drawHud(w, h);
      drawLogPanel(w, h);
      if (state.showMap) drawMap(w, h);
      if (state.gameOver) drawGameOver(w, h);
    }

    function frames(x, y, w, h) {
      return [1, 0.62, 0.36, 0.18, 0.08].map(scale => {
        const fw = w * scale;
        const fh = h * scale;
        return { x: x + (w - fw) / 2, y: y + (h - fh) / 2, w: fw, h: fh };
      });
    }

    function dungeonViewRect(w, h) {
      return { x: 34, y: 28, w: 760, h: 420 };
    }

    function drawView(w, h) {
      const view = dungeonViewRect(w, h);
      const fs = frames(view.x, view.y, view.w, view.h);
      const wallFill = "#020202";
      const wallLine = neonWallColor();
      drawDistantHaze(view, fs);
      drawFloorTileHighlights(fs);
      for (let depth = 1; depth < fs.length; depth += 1) {
        const front = relativePos(0, depth);
        const left = relativePos(-1, depth - 1);
        const right = relativePos(1, depth - 1);
        const nextLeft = relativePos(-1, depth);
        const nextRight = relativePos(1, depth);
        const hasLeft = isWall(left.x, left.y);
        const hasRight = isWall(right.x, right.y);
        const hasNextLeft = isWall(nextLeft.x, nextLeft.y);
        const hasNextRight = isWall(nextRight.x, nextRight.y);
        const near = fs[depth - 1];
        const far = fs[depth];

        if (hasLeft) {
          wallPanel([
            [near.x, near.y],
            [far.x, far.y],
            [far.x, far.y + far.h],
            [near.x, near.y + near.h]
          ], wallFill, wallLine, depth);
        } else if (hasNextLeft) {
          wallRect({ x: near.x, y: far.y, w: far.x - near.x, h: far.h }, wallFill, wallLine, depth);
        }

        if (hasRight) {
          wallPanel([
            [near.x + near.w, near.y],
            [far.x + far.w, far.y],
            [far.x + far.w, far.y + far.h],
            [near.x + near.w, near.y + near.h]
          ], wallFill, wallLine, depth);
        } else if (hasNextRight) {
          wallRect({ x: far.x + far.w, y: far.y, w: near.x + near.w - far.x - far.w, h: far.h }, wallFill, wallLine, depth);
        }

        if (isWall(front.x, front.y)) {
          wallRect(far, wallFill, wallLine, depth);
          return;
        }

        drawObject(front, far, depth);
      }
    }

    function neonWallColor() {
      return colors.neonWalls[(state.floor - 1) % colors.neonWalls.length];
    }

    function nextFloorColor() {
      return colors.neonWalls[state.floor % colors.neonWalls.length];
    }

    function upperFloorColor() {
      const index = Math.max(0, state.floor - 2) % colors.neonWalls.length;
      return colors.neonWalls[index];
    }

    function drawDistantHaze(view, fs) {
      const center = fs[fs.length - 1];
      const cx = center.x + center.w / 2;
      const cy = center.y + center.h / 2;
      const gradient = ctx.createRadialGradient(cx, cy, 8, cx, cy, view.w * 0.32);
      gradient.addColorStop(0, colors.distantHaze);
      gradient.addColorStop(0.45, "rgba(60, 78, 96, 0.07)");
      gradient.addColorStop(1, "rgba(0, 0, 0, 0)");
      ctx.fillStyle = gradient;
      ctx.fillRect(view.x, view.y, view.w, view.h);
    }

    function drawFloorTileHighlights(fs) {
      for (let depth = 0; depth < fs.length - 1; depth += 1) {
        const pos = depth === 0 ? { x: state.x, y: state.y } : relativePos(0, depth);
        if (isStartTile(pos)) {
          drawCeilingTileHighlight(ceilingTilePoints(fs, depth), upperFloorColor(), depth);
        }
        if (depth > 0 && same(pos, state.stairs)) {
          drawFloorTileHighlight(floorTilePoints(fs, depth), nextFloorColor(), depth);
        }
        if (depth > 0 && canRevealHazards() && isWarpTile(pos)) {
          drawFloorTileHighlight(floorTilePoints(fs, depth), "#9a7cff", depth);
        }
        if (depth > 0 && canRevealHazards() && isTrapTile(pos)) {
          drawFloorTileHighlight(floorTilePoints(fs, depth), "#ff4fd8", depth);
        }
      }
    }

    function floorTilePoints(fs, depth) {
      const near = fs[depth];
      const far = fs[depth + 1];
      return [
        [near.x, near.y + near.h],
        [near.x + near.w, near.y + near.h],
        [far.x + far.w, far.y + far.h],
        [far.x, far.y + far.h]
      ];
    }

    function ceilingTilePoints(fs, depth) {
      const near = fs[depth];
      const far = fs[depth + 1];
      return [
        [near.x, near.y],
        [far.x, far.y],
        [far.x + far.w, far.y],
        [near.x + near.w, near.y]
      ];
    }

    function drawFloorTileHighlight(points, color, depth) {
      const bounds = panelBounds(points);
      const alpha = Math.max(0.16, 0.34 - depth * 0.035);
      const gradient = ctx.createLinearGradient(bounds.x, bounds.y, bounds.x, bounds.y + bounds.h);
      gradient.addColorStop(0, neonRgba(color, alpha * 0.28));
      gradient.addColorStop(0.42, neonRgba(color, alpha));
      gradient.addColorStop(1, neonRgba(color, alpha * 0.18));

      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      ctx.beginPath();
      ctx.moveTo(points[0][0], points[0][1]);
      for (const point of points.slice(1)) ctx.lineTo(point[0], point[1]);
      ctx.closePath();
      ctx.fillStyle = gradient;
      ctx.shadowColor = color;
      ctx.shadowBlur = Math.max(10, 24 - depth * 3);
      ctx.fill();

      ctx.globalAlpha = 0.55;
      ctx.lineWidth = Math.max(1, 3 - depth * 0.35);
      ctx.strokeStyle = color;
      ctx.shadowBlur = Math.max(4, 14 - depth * 2);
      strokePanelPath(points);
      ctx.restore();
    }

    function drawCeilingTileHighlight(points, color, depth) {
      const bounds = panelBounds(points);
      const alpha = Math.max(0.14, 0.3 - depth * 0.03);
      const gradient = ctx.createLinearGradient(bounds.x, bounds.y, bounds.x, bounds.y + bounds.h);
      gradient.addColorStop(0, neonRgba(color, alpha * 0.18));
      gradient.addColorStop(0.58, neonRgba(color, alpha));
      gradient.addColorStop(1, neonRgba(color, alpha * 0.25));

      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      ctx.beginPath();
      ctx.moveTo(points[0][0], points[0][1]);
      for (const point of points.slice(1)) ctx.lineTo(point[0], point[1]);
      ctx.closePath();
      ctx.fillStyle = gradient;
      ctx.shadowColor = color;
      ctx.shadowBlur = Math.max(8, 20 - depth * 3);
      ctx.fill();

      ctx.globalAlpha = 0.5;
      ctx.lineWidth = Math.max(1, 2.5 - depth * 0.3);
      ctx.strokeStyle = color;
      ctx.shadowBlur = Math.max(4, 12 - depth * 2);
      strokePanelPath(points);
      ctx.restore();
    }

    function drawWallShade(near, far, side) {
      const shadeSteps = [0.26, 0.52, 0.78];
      for (const step of shadeSteps) {
        let topX;
        let topY;
        let bottomX;
        let bottomY;

        if (side === "left") {
          topX = lerp(near.x, far.x, step);
          topY = lerp(near.y, far.y, step);
          bottomX = lerp(near.x, far.x, step);
          bottomY = lerp(near.y + near.h, far.y + far.h, step);
        } else {
          topX = lerp(near.x + near.w, far.x + far.w, step);
          topY = lerp(near.y, far.y, step);
          bottomX = lerp(near.x + near.w, far.x + far.w, step);
          bottomY = lerp(near.y + near.h, far.y + far.h, step);
        }

        line(topX, topY, bottomX, bottomY, colors.wallShade, 1);
      }
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }
